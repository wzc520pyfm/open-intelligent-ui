<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Agents answer with interfaces: a model writes a reply as markup, and it renders live on UI SDK components in your DESIGN.md."
    />
    <title>Open Intelligent UI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Before the first paint, so a dark page never flashes light.
      ;(() => {
        const asked = new URLSearchParams(location.search).get("scheme")
        const dark = asked ? asked === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400..600&family=Space+Grotesk:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
