name: Release

# Publishes every package under packages/ to npm, then opens a GitHub Release
# for the matching tag.
# Runs when a tag like v0.1.0 or v0.2.0-beta.1 is pushed, or by hand from the
# Actions tab (npm only; a GitHub Release is created for tag pushes).
# Needs the repository secret NPM_TOKEN: an npm token allowed to publish to
# the @open-intelligent-ui scope and the open-intelligent-ui name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Notes for the GitHub Release need the previous tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:packages
      # Picks the dist-tag from the version, so a prerelease never becomes `latest`.
      - run: node scripts/publish-packages.mjs --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac
          # Skip if this tag already has a Release (re-runs / manual recovery).
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it as is."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "${prerelease[@]}"
