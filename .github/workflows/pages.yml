name: Deploy playground to Cloudflare Pages

# Direct Upload via Wrangler. Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   — Pages Write (and Account Read)
#   CLOUDFLARE_ACCOUNT_ID  — 966b90254dea747c8ca106d2b40c2ce4
# Create a token: https://dash.cloudflare.com/profile/api-tokens
# Template: "Edit Cloudflare Workers" is enough, or a custom token with Pages:Edit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Avoid wrangler-action's `pnpm add` — it fails in a pnpm workspace without -w.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4 pages deploy apps/playground/dist
          --project-name=open-intelligent-ui
          --branch=main
