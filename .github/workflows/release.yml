name: Release

# Publishes @open-intelligent-ui/core and @open-intelligent-ui/react to npm.
# Runs when a tag like v0.1.0 is pushed, or by hand from the Actions tab.
# Needs the repository secret NPM_TOKEN: an npm token allowed to publish to the @open-intelligent-ui scope.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:packages
      - run: pnpm -r --filter "./packages/*" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
